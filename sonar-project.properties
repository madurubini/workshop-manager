# Configuração do scanner do SonarQube (self-hosted).
# Rode o scan com o sonar-scanner-cli apontando para http://localhost:9000.
# Veja o passo a passo em docs/sonarqube.md.

sonar.projectKey=workshop-manager
sonar.projectName=Workshop Manager (Oficina)
sonar.projectVersion=0.1.0

# Código de produção e testes
sonar.sources=src
sonar.tests=src,test
sonar.test.inclusions=**/*.spec.ts,test/**/*.ts

# Fora da análise de código de produção (gerados, testes, infra)
sonar.exclusions=**/*.spec.ts,test/**/*,prisma/migrations/**,dist/**,coverage/**

# Não cobrar cobertura de arquivos sem lógica de negócio
sonar.coverage.exclusions=**/*.module.ts,src/main.ts,**/dtos.ts,**/*.dto.ts,prisma/**

# Cobertura de testes (lcov gerado por `npm run test:cov`)
sonar.javascript.lcov.reportPaths=coverage/lcov.info

sonar.sourceEncoding=UTF-8
