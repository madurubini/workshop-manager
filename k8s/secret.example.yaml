# ─────────────────────────────────────────────────────────────────────────────
# EXEMPLO DOCUMENTAL — este arquivo NÃO é aplicado no cluster.
#
# O Secret real (`oficina-secrets`) é criado pelo Terraform em /infra a partir
# de variáveis, justamente para que nenhuma credencial seja versionada no git.
# Ele existe aqui só para documentar o formato que o Deployment espera.
#
# Um Secret do Kubernetes guarda os valores em base64 (codificação, não
# criptografia) e é montado no pod como variável de ambiente, do mesmo jeito
# que o ConfigMap — a diferença está no controle de acesso e em não aparecer
# em logs e `kubectl describe`.
#
# Para criar manualmente (fora do Terraform):
#   kubectl create secret generic oficina-secrets -n oficina \
#     --from-literal=DATABASE_URL='postgresql://oficina:senha@oficina-db:5432/oficina?schema=public' \
#     --from-literal=JWT_SECRET='troque-este-segredo'
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: oficina-secrets
  namespace: oficina
type: Opaque
stringData:
  DATABASE_URL: 'postgresql://oficina:oficina@oficina-db:5432/oficina?schema=public'
  JWT_SECRET: 'troque-este-segredo-em-producao'
