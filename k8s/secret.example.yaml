# Exemplo do Secret esperado pelo Deployment. NÃO é aplicado: o Secret real é
# criado pelo Terraform (infra/main.tf) a partir de variáveis, para não
# versionar credencial.
apiVersion: v1
kind: Secret
metadata:
  name: oficina-secrets
  namespace: oficina
type: Opaque
stringData:
  DATABASE_URL: 'postgresql://oficina:oficina@oficina-db:5432/oficina?schema=public'
  JWT_SECRET: 'troque-este-segredo-em-producao'
