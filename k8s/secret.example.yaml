# Formato do Secret que o Deployment espera (envFrom → secretRef). Este arquivo
# NÃO é aplicado, e os valores abaixo são placeholders.
#
# O Secret real é provisionado como código pelo Terraform, em infra/main.tf:
# ele recebe os valores por variável (marcada `sensitive`) e os cria no cluster.
# Versionar o Secret aqui colocaria a senha do banco e o segredo do JWT em texto
# no repositório — que é justamente o que um Secret existe para evitar.
#
# Para criar à mão, sem Terraform:
#   kubectl create secret generic oficina-secrets -n oficina \
#     --from-literal=DATABASE_URL='postgresql://usuario:senha@oficina-db:5432/oficina?schema=public' \
#     --from-literal=JWT_SECRET='...'
apiVersion: v1
kind: Secret
metadata:
  name: oficina-secrets
  namespace: oficina
type: Opaque
stringData:
  DATABASE_URL: 'postgresql://oficina:oficina@oficina-db:5432/oficina?schema=public'
  JWT_SECRET: 'troque-este-segredo-em-producao'
