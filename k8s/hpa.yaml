# HorizontalPodAutoscaler observa o consumo dos pods e ajusta o número de
# réplicas do Deployment sozinho — "horizontal" porque cria mais cópias, em vez
# de dar mais CPU/memória para as existentes (isso seria vertical).
#
# Depende do metrics-server para ler o consumo:
#   minikube addons enable metrics-server
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: oficina-api
  namespace: oficina
  labels:
    app.kubernetes.io/name: oficina-api
    app.kubernetes.io/part-of: workshop-manager
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: oficina-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    # "60% de utilização" significa 60% do requests.cpu declarado no Deployment
    # (100m), ou seja, 60m de consumo médio por pod dispara o crescimento.
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75
  behavior:
    scaleUp:
      # Reage rápido ao pico: sem janela de espera antes de crescer.
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100 # pode dobrar o número de pods
          periodSeconds: 15
    scaleDown:
      # Desce devagar: espera 2 min de calmaria para evitar ficar oscilando.
      stabilizationWindowSeconds: 120
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
