apiVersion: apps/v1
kind: Deployment
metadata:
  name: oficina-api
  namespace: oficina
  labels:
    app.kubernetes.io/name: oficina-api
    app.kubernetes.io/part-of: workshop-manager
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: oficina-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: oficina-api
    spec:
      containers:
        - name: api
          image: oficina-api:local
          # A imagem é carregada no cluster (make imagem), não vem de registry.
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: oficina-config
            - secretRef:
                name: oficina-secrets
          startupProbe:
            httpGet:
              path: /api/v1/health/live
              port: http
            periodSeconds: 2
            failureThreshold: 30
          # Liveness reinicia o pod, por isso não consulta o banco: uma queda do
          # Postgres reiniciaria réplicas sadias em cascata. A readiness, que só
          # tira do balanceamento, é quem verifica.
          livenessProbe:
            httpGet:
              path: /api/v1/health/live
              port: http
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/v1/health/ready
              port: http
            periodSeconds: 10
            failureThreshold: 3
          # requests é o denominador do HPA — sem ele o autoscaler fica em <unknown>.
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            # uid numérico: com `USER node` (nome) o kubelet não consegue
            # verificar runAsNonRoot e recusa o pod.
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
