# Migra o banco uma vez, antes da API subir. Fora do start da aplicação porque
# as réplicas criadas pelo HPA migrariam o mesmo banco simultaneamente.
apiVersion: batch/v1
kind: Job
metadata:
  name: migracoes
  namespace: oficina
  labels:
    app.kubernetes.io/name: migracoes
    app.kubernetes.io/part-of: workshop-manager
spec:
  backoffLimit: 4
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: migracoes
    spec:
      restartPolicy: Never
      initContainers:
        - name: aguardar-banco
          image: postgres:16-alpine
          command:
            - sh
            - -c
            - |
              until pg_isready -h oficina-db -p 5432; do
                echo "Postgres ainda não responde; aguardando..."
                sleep 2
              done
      containers:
        - name: migracoes
          image: oficina-api:local
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - 'npx prisma migrate deploy && node dist/prisma/seed.js'
          envFrom:
            - configMapRef:
                name: oficina-config
            - secretRef:
                name: oficina-secrets
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
