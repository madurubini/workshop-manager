# Stack do SonarQube (self-hosted) para análise estática do código.
# Separado do docker-compose.yml da aplicação — suba só quando for analisar:
#   docker compose -f docker-compose.sonar.yml up -d
# Depois acesse http://localhost:9000 (admin/admin no 1º acesso).
# Pré-requisito do host (Elasticsearch): sysctl -w vm.max_map_count=262144
# Passo a passo completo em docs/sonarqube.md.

services:
  sonarqube:
    image: sonarqube:community
    container_name: oficina-sonarqube
    depends_on:
      sonar-db:
        condition: service_healthy
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonar-db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar
    ports:
      - '9000:9000'
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  sonar-db:
    image: postgres:16-alpine
    container_name: oficina-sonar-db
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
      POSTGRES_DB: sonar
    volumes:
      - sonar_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sonar']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
  sonar_pgdata:
