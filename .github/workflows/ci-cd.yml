# O job de deploy sobe um Minikube dentro do próprio runner: um runner
# hospedado não tem rota até um cluster local, e assim o deploy é verificado a
# cada push sem depender de nenhuma máquina ligada.
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  IMAGEM: oficina-api
  TAG: local
  NAMESPACE: oficina

jobs:
  qualidade:
    name: Build e testes
    runs-on: ubuntu-latest

    # Os e2e da Ordem de Serviço rodam contra um Postgres real (fazem db push e
    # exercitam o gateway Prisma).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: oficina
          POSTGRES_PASSWORD: oficina
          POSTGRES_DB: oficina_e2e
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Preparar Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Gerar o Prisma Client
        run: npm run prisma:generate

      - name: Lint
        run: npm run lint

      - name: Build da aplicação
        run: npm run build

      - name: Testes unitários com cobertura
        run: npm run test:cov

      - name: Testes end-to-end
        env:
          DATABASE_URL_E2E: postgresql://oficina:oficina@localhost:5433/oficina_e2e?schema=public
        run: npm run test:e2e

  imagem:
    name: Imagem Docker
    runs-on: ubuntu-latest
    needs: qualidade
    steps:
      - uses: actions/checkout@v4

      - name: Build da imagem
        run: docker build -t ${{ env.IMAGEM }}:${{ env.TAG }} .

      # Sem registry no fluxo, a imagem viaja entre jobs como arquivo.
      - name: Exportar a imagem para o próximo job
        run: docker save ${{ env.IMAGEM }}:${{ env.TAG }} -o imagem.tar

      - name: Publicar artefato
        uses: actions/upload-artifact@v4
        with:
          name: imagem-docker
          path: imagem.tar
          retention-days: 1

  infraestrutura:
    name: Validação do Terraform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.9

      - name: Formatação
        run: terraform fmt -check -recursive
        working-directory: infra

      # -backend=false: aqui só validamos a sintaxe, não há cluster nem estado.
      - name: Inicializar sem backend
        run: terraform init -backend=false
        working-directory: infra

      - name: Validar
        run: terraform validate
        working-directory: infra

  deploy:
    name: Deploy no Kubernetes
    runs-on: ubuntu-latest
    needs: [imagem, infraestrutura]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Subir um cluster Minikube no runner
        uses: medyagh/setup-minikube@latest
        with:
          cpus: 2
          memory: 4000mb
          addons: metrics-server

      - name: Baixar a imagem do job anterior
        uses: actions/download-artifact@v4
        with:
          name: imagem-docker

      - name: Carregar a imagem no cluster
        run: |
          docker load -i imagem.tar
          minikube image load ${{ env.IMAGEM }}:${{ env.TAG }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.9
          terraform_wrapper: false

      - name: Provisionar namespace, Secrets e banco de dados (Terraform)
        run: |
          terraform init -input=false
          terraform apply -input=false -auto-approve \
            -var="banco_senha=${{ secrets.BANCO_SENHA || 'senha-de-ci' }}" \
            -var="jwt_secret=${{ secrets.JWT_SECRET || 'segredo-de-ci' }}"
        working-directory: infra

      - name: Aplicar os manifestos da aplicação
        run: |
          kubectl apply -f k8s/configmap.yaml
          kubectl apply -f k8s/job-migracoes.yaml
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml
          kubectl apply -f k8s/hpa.yaml

      - name: Aguardar as migrations
        run: |
          kubectl wait --for=condition=complete job/migracoes \
            -n ${{ env.NAMESPACE }} --timeout=300s
          kubectl logs job/migracoes -n ${{ env.NAMESPACE }} --tail=20

      - name: Aguardar a API entrar no ar
        run: |
          kubectl rollout status deployment/oficina-api \
            -n ${{ env.NAMESPACE }} --timeout=300s

      - name: Smoke test
        run: |
          URL="http://$(minikube ip):30080"
          echo "API em $URL"

          curl -fsS "$URL/api/v1/health/live"  | tee /dev/stderr | grep -q '"status":"ok"'
          curl -fsS "$URL/api/v1/health/ready" | tee /dev/stderr | grep -q '"database":{"status":"up"}'

          curl -fsS -X POST "$URL/api/v1/auth/login" \
            -H 'Content-Type: application/json' \
            -d '{"username":"gestor","senha":"gestor123"}' \
            | grep -q accessToken

          echo "Smoke test concluído com sucesso."

      - name: Estado final do cluster
        if: always()
        run: |
          kubectl get all,pvc,configmap,secret -n ${{ env.NAMESPACE }}
          kubectl describe hpa oficina-api -n ${{ env.NAMESPACE }} || true
