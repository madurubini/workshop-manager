services:
  db:
    image: postgres:16-alpine
    container_name: oficina-db
    environment:
      POSTGRES_USER: oficina
      POSTGRES_PASSWORD: oficina
      POSTGRES_DB: oficina
    ports:
      - '5433:5432'
    volumes:
      - oficina-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U oficina -d oficina']
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: oficina-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: 'postgresql://oficina:oficina@db:5432/oficina?schema=public'
      PORT: '3000'
      NODE_ENV: production
      JWT_SECRET: 'segredo-de-desenvolvimento-nao-use-em-producao'
      JWT_EXPIRES_IN: '3600s'
    ports:
      - '3000:3000'
    healthcheck:
      # Usa o fetch nativo do Node 20 (a imagem slim não tem curl/wget).
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  oficina-pgdata:
